<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head>
<body>
<title>Claude Leaderboard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one column, 960px max, cards for this week, tables for history. Votes sit on every card and row. */
:root{--bg:#F3F6F8;--card:#fff;--line:#E4EAEF;--ink:#22303C;--ink2:#5A6B7A;--mute:#A5B1BB;--soft:#F5F8FA;--row:#F0F3F6;
  --green:#0E6E5C;--green2:#E9F6F1;--amber:#8A6116;--amber2:#FBF3E4;--red:#9A3B3B;--red2:#FBEAEA;
  --blue:#2B5C8A;--blue2:#E8F0F8;--body:'Segoe UI',system-ui,sans-serif;--mono:Consolas,'SF Mono',monospace}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#141A1F;--card:#1C242B;--line:#2B3540;--ink:#E6EBEF;--ink2:#9AA7B2;--mute:#6B7883;--soft:#222C34;--row:#1F2830;
  --green:#5FC9AF;--green2:#17332D;--amber:#E0B35B;--amber2:#33290F;--red:#E08C8C;--red2:#3A1F1F;--blue:#8DB6E0;--blue2:#1B2A3A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141A1F;--card:#1C242B;--line:#2B3540;--ink:#E6EBEF;--ink2:#9AA7B2;--mute:#6B7883;--soft:#222C34;--row:#1F2830;
  --green:#5FC9AF;--green2:#17332D;--amber:#E0B35B;--amber2:#33290F;--red:#E08C8C;--red2:#3A1F1F;--blue:#8DB6E0;--blue2:#1B2A3A;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;padding-block:28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--bg);font-family:var(--body);color:var(--ink);line-height:1.45}
.wrap{max-width:960px;margin:0 auto;min-width:0}
h1{font-size:22px;margin:0;text-wrap:balance}
.head{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px}
.stamp{font-family:var(--mono);font-size:12px;color:var(--ink2)}
.flag{display:inline-block;margin-left:6px;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:700}
.flag.ok{background:var(--green2);color:var(--green)}
.flag.thin{background:var(--amber2);color:var(--amber)}
.flag.skipped,.flag.error{background:var(--red2);color:var(--red)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}
@media(max-width:600px){.tiles{grid-template-columns:repeat(2,1fr)}}
.tile{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.tile .n{font-size:24px;font-weight:650;font-variant-numeric:tabular-nums}
.tile .l{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);margin-top:2px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
.tab{border:1px solid var(--line);border-radius:999px;padding:5px 14px;font-size:13px;background:var(--card);cursor:pointer;color:var(--ink);user-select:none}
.tab.on{background:var(--green);border-color:var(--green);color:var(--card)}
.tab:focus-visible,.vb:focus-visible,.chip:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
h2{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink2);margin:22px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:10px;cursor:pointer;min-width:0}
.card .top{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.rank{font-family:var(--mono);font-size:13px;color:var(--ink2);min-width:26px}
.title{font-weight:650;flex:1 1 200px;overflow-wrap:anywhere;min-width:0}
.score{display:inline-block;min-width:38px;text-align:center;padding:2px 8px;border-radius:999px;font-weight:700;font-size:12px;background:var(--green2);color:var(--green);font-variant-numeric:tabular-nums}
.cat{font-size:10px;font-weight:700;padding:1px 7px;border-radius:4px;text-transform:uppercase;letter-spacing:.04em}
.cat.money{background:var(--green2);color:var(--green)}
.cat.time{background:var(--blue2);color:var(--blue)}
.cat.life{background:var(--amber2);color:var(--amber)}
.pitch{font-size:13px;color:var(--ink);opacity:.9;margin-top:6px;overflow-wrap:anywhere}
.step{font-size:13px;margin-top:6px}
.step b{color:var(--ink2);font-weight:600;margin-right:4px}
.links{font-size:12px;margin-top:6px}
.links a{color:var(--green);text-decoration:none;margin-right:10px}
.detail{display:none;margin-top:10px;border-top:1px solid var(--line);padding-top:10px}
.card.open .detail{display:block}
.sub{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;font-size:12px}
.sub div{background:var(--bg);border-radius:6px;padding:6px 8px}
.sub .k{color:var(--ink2);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.sub .v{font-weight:700;font-variant-numeric:tabular-nums}
.sub .r{color:var(--ink);opacity:.85;margin-top:2px}
.leaders{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:700px){.leaders{grid-template-columns:1fr}}
.leaders .card{margin:0}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink2);background:var(--soft);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--row);vertical-align:top}
tr.row{cursor:pointer}
tr.more td{background:var(--soft)}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:8px;padding:28px;text-align:center;color:var(--ink2)}
.note{font-size:12px;color:var(--amber);margin:8px 0}
.learned{font-size:13px;color:var(--ink2);margin:10px 0 0;padding:10px 14px;background:var(--card);border:1px solid var(--line);border-radius:8px}
.hist{margin-top:22px;font-family:var(--mono);font-size:12px;color:var(--ink2);display:flex;gap:8px;flex-wrap:wrap}
.hist span{padding:2px 8px;border-radius:4px;background:var(--card);border:1px solid var(--line)}
.foot{margin-top:14px;font-size:12px;color:var(--mute)}
.foot a{color:var(--ink2)}
th[data-sort]{cursor:pointer;user-select:none}
th[data-sort]:hover,th.on{color:var(--ink)}
td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.idea{min-width:240px}
.legend{font-size:12px;color:var(--ink2);margin-top:8px;line-height:1.6}
.legend b{color:var(--ink)}
/* votes */
.votes{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:10px}
.votes[hidden]{display:none}
.vb{border:1px solid var(--line);background:var(--card);color:var(--ink2);border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer;font-family:var(--body)}
.vb:hover{border-color:var(--ink2)}
.vb.on.interested{background:var(--green2);border-color:var(--green);color:var(--green)}
.vb.on.no{background:var(--red2);border-color:var(--red);color:var(--red)}
.vb.on.trying{background:var(--blue2);border-color:var(--blue);color:var(--blue)}
.reasons{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{border:1px dashed var(--line);background:transparent;color:var(--ink2);border-radius:999px;padding:2px 10px;font-size:12px;cursor:pointer;font-family:var(--body)}
.chip.on{border-style:solid;border-color:var(--red);color:var(--red);background:var(--red2)}
.outcome{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.outcome input{flex:1 1 200px;min-width:0;border:1px solid var(--line);border-radius:6px;padding:6px 10px;font:inherit;font-size:13px;background:var(--bg);color:var(--ink)}
.outcome button{border:1px solid var(--green);background:var(--green);color:var(--card);border-radius:6px;padding:6px 12px;font:inherit;font-size:12px;cursor:pointer}
.vstate{font-size:12px;color:var(--ink2);margin-top:6px}
.hidden-toggle{font-size:12px;color:var(--ink2);cursor:pointer;margin-top:12px;user-select:none}
.saved{color:var(--green)}
@media (prefers-reduced-motion: no-preference){.vb,.chip{transition:background .15s,border-color .15s}}
</style>
<div class="wrap">
<div class="head"><h1>Claude Leaderboard</h1><div class="stamp" id="stamp">loading…</div></div>
<div class="learned" id="learned" hidden></div>
<div class="tiles" id="tiles"></div>
<div class="tabs" id="tabs">
  <span class="tab on" data-tab="week" tabindex="0">This week</span>
  <span class="tab" data-tab="all" tabindex="0">All time</span>
  <span class="tab" data-tab="rising" tabindex="0">Rising</span>
</div>
<div id="view"></div>
<div class="hist" id="hist"></div>
<div class="foot">Weekly scan of Reddit, Substack, Hacker News and more for productive and money-making uses of Claude. Scores follow the rubric in the <a href="https://github.com/not-in-scope/claude-leaderboard" target="_blank" rel="noopener">repository</a>.</div>
</div>
<script>
const FACTORS = [["fit","Fit for you",25],["upside","Upside",20],["time_to_dollar","Time to benefit",15],
                 ["effort","Effort",15],["evidence","Evidence",15],["durability","Durability",10]];
const CATS = ["money","time","life"];
const LEGEND = {
  fit: "how much it uses skills you already have (PM, data, AI, compliance), or for life ideas how well it fits your household",
  upside: "realistic annual dollars, or hours saved a week",
  time_to_dollar: "how soon the first dollar or saved hour arrives",
  effort: "hours a week it takes to run once set up",
  evidence: "how many independent reports back it, and how specific they are",
  durability: "whether it still works in two years",
};
let SORT = {};
const REASONS = [["effort","Too much effort"],["skills","Not my skills"],["doubt","Don't believe it"],["already","Already doing it"]];
const DATA_PARAM = new URLSearchParams(location.search).get("data");
const sameOrigin = p => { try { return new URL(p, location.href).origin === location.origin; } catch { return false; } };
const DATA_URL = DATA_PARAM && sameOrigin(DATA_PARAM) ? DATA_PARAM : "data/leaderboard.json";
let BOARD = null, TAB = "week", CAT = "all", SHOW_HIDDEN = false;
let DB = null, CAN_VOTE = false, VOTES = {}, OPEN_REASONS = null;

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtDate = iso => iso ? new Date(iso).toLocaleDateString(undefined, {month:"short", day:"numeric", year:"numeric"}) : "";
const host = u => { try { return new URL(u).hostname.replace(/^www\./, ""); } catch { return u; } };
const money = n => "$" + Number(n).toLocaleString();
const voteOf = id => VOTES[id] || null;

function flag(status){ return `<span class="flag ${esc(status)}">${esc(status)}</span>`; }
function cat(c){ return `<span class="cat ${esc(c)}">${esc(c)}</span>`; }
function links(ev){
  return (ev || []).map(e => /^https?:\/\//i.test(e.url)
    ? `<a href="${esc(e.url)}" target="_blank" rel="noopener" title="${esc(e.claim || "")}">${esc(e.source || host(e.url))}</a>`
    : `<span>${esc(e.source || "")}</span>`).join("");
}
function subscores(scores, reasons){
  return `<div class="sub">${FACTORS.map(([k, l, m]) =>
    `<div><div class="k">${l}</div><div class="v">${scores?.[k] ?? "–"} / ${m}</div><div class="r">${esc(reasons?.[k] || "")}</div></div>`).join("")}</div>`;
}
function dollars(d, hrs){
  if (!d) return "";
  return `<div class="pitch">Est. ${money(d.low)} to ${money(d.high)} ${esc(d.basis)} · ${esc(hrs)} hrs/week to run</div>`;
}
function voteBar(id){
  if (!CAN_VOTE) return "";
  const v = voteOf(id), vote = v?.vote;
  const btn = (k, label) => `<button type="button" class="vb ${k} ${vote === k ? "on" : ""}" data-vote="${k}" data-id="${esc(id)}">${label}</button>`;
  let html = `<div class="votes">${btn("interested", "Interested")}${btn("no", "Not for me")}${btn("trying", "Trying it")}`;
  if (v?.at) html += `<span class="vstate">${vote === "no" && v.reason ? esc(REASONS.find(r => r[0] === v.reason)?.[1] || v.reason) + " · " : ""}${fmtDate(v.at)}</span>`;
  html += `</div>`;
  if (OPEN_REASONS === id || (vote === "no" && !v.reason)) {
    html += `<div class="reasons">${REASONS.map(([k, l]) => `<button type="button" class="chip ${v?.reason === k ? "on" : ""}" data-reason="${k}" data-id="${esc(id)}">${l}</button>`).join("")}</div>`;
  }
  if (vote === "trying") {
    html += `<div class="outcome"><input id="out-${esc(id)}" placeholder="What happened so far?" value="${esc(v.outcome || "")}" data-id="${esc(id)}"><button type="button" data-save="${esc(id)}">Save</button></div>`;
  }
  return html;
}
function card(c, rank){
  const L = c.latest || {};
  const scores = c.scores || L.scores, reasons = c.reasons || L.reasons;
  const total = c.total ?? c.best_score;
  const pitch = c.pitch ?? L.pitch, step = c.first_step ?? L.first_step;
  const d = c.dollars || L.dollars, hrs = c.hours_per_week ?? L.hours_per_week;
  return `<div class="card" data-card="${esc(c.id)}">
    <div class="top">${rank ? `<span class="rank">#${rank}</span>` : ""}<span class="title">${esc(c.title)}</span>${cat(c.category)}<span class="score">${total}</span></div>
    <div class="pitch">${esc(pitch)}</div>
    <div class="step"><b>First step</b>${esc(step)}</div>
    <div class="links">${links(c.evidence)}</div>
    ${voteBar(c.id)}
    <div class="detail">${subscores(scores, reasons)}${dollars(d, hrs)}</div>
  </div>`;
}
function renderTiles(b){
  const tw = b.this_week;
  const tiles = [
    [tw ? tw.candidates_scored : 0, "Scored this week"],
    [tw ? tw.top5.length : 0, "Published"],
    [b.all_time.length, "Ideas tracked"],
    [b.rising.length, "Rising"],
  ];
  document.getElementById("tiles").innerHTML = tiles.map(([n, l]) => `<div class="tile"><div class="n">${n}</div><div class="l">${l}</div></div>`).join("");
}
const isHidden = id => voteOf(id)?.vote === "no";
function picks(b){
  const all = {};
  for (const r of b.all_time) all[r.id] = r;
  for (const r of b.rising) all[r.id] = r;
  for (const r of (b.picks?.interested || [])) all[r.id] = r;
  for (const r of (b.picks?.trying || [])) all[r.id] = r;
  for (const r of (b.picks?.hidden || [])) all[r.id] = r;
  const tw = b.this_week;
  if (tw) {
    for (const c of tw.top5) all[c.id] = all[c.id] || c;
    for (const k of CATS) { const L = tw.category_leaders?.[k]; if (L) all[L.id] = all[L.id] || L; }
  }
  const by = kind => Object.values(all).filter(r => r && r.id && voteOf(r.id)?.vote === kind);
  return {interested: by("interested"), trying: by("trying"), hidden: by("no")};
}
function renderWeek(b){
  const tw = b.this_week;
  if (!tw) return `<div class="empty">No runs yet. The first scan lands on Monday morning.</div>`;
  let html = "";
  if (tw.status === "thin") html += `<div class="note">Thin week. ${tw.candidates_scored} candidates were scored, below the 50 target.</div>`;
  if (tw.status === "skipped") html += `<div class="note">Skipped week, no top 5. ${esc(tw.note || "Fewer than 15 candidates were found.")}</div>`;
  const top = tw.top5.filter(c => SHOW_HIDDEN || !isHidden(c.id));
  if (top.length) html += `<h2>Top 5 · ${esc(tw.week)}</h2>` + top.map((c, i) => card(c, i + 1)).join("");
  const L = tw.category_leaders || {};
  if (CATS.some(k => L[k])) {
    html += `<h2>Category leaders</h2><div class="leaders">${CATS.map(k => L[k] ? card(L[k]) : `<div class="empty">No ${k} idea this week</div>`).join("")}</div>`;
  }
  if (CAN_VOTE) {
    const p = picks(b);
    if (p.interested.length || p.trying.length) {
      html += `<h2>Your picks</h2>`;
      if (p.trying.length) html += `<div class="note" style="color:var(--blue)">Trying</div>` + p.trying.map(r => card(r)).join("");
      if (p.interested.length) html += `<div class="note" style="color:var(--green)">Interested</div>` + p.interested.map(r => card(r)).join("");
    }
    if (p.hidden.length) {
      html += `<div class="hidden-toggle" id="hiddenToggle">${SHOW_HIDDEN ? "Hide" : "Show"} ${p.hidden.length} idea${p.hidden.length === 1 ? "" : "s"} you marked not for me</div>`;
      if (SHOW_HIDDEN) html += p.hidden.map(r => card(r)).join("");
    }
  }
  const all = (tw.candidates || []).filter(c => CAT === "all" || c.category === CAT);
  if (tw.candidates?.length) {
    const chips = ["all", ...CATS].map(k => `<span class="tab ${CAT === k ? "on" : ""}" data-cat="${k}" tabindex="0">${k}</span>`).join("");
    html += `<h2>All ${tw.candidates.length} scored this week</h2><div class="tabs" id="cats">${chips}</div>` + renderTable(all.map(c => asRow(c, tw.week)), "week") + legend();
  }
  if (tw.sources_failed?.length) html += `<div class="note">Sources that failed this run: ${tw.sources_failed.map(s => esc(s.source)).join(", ")}</div>`;
  return html;
}
function sortRows(rows, id){
  const s = SORT[id] || {key: "total", dir: "desc"};
  const val = r => s.key === "title" ? (r.title || "").toLowerCase()
    : s.key === "category" ? r.category
    : s.key === "weeks" ? (r.weeks_seen || 0)
    : s.key === "total" ? r.total
    : (r.scores?.[s.key] ?? -1);
  const out = [...rows].sort((a, b) => {
    const x = val(a), y = val(b);
    if (x === y) return (b.total ?? 0) - (a.total ?? 0) || (a.title || "").localeCompare(b.title || "");
    return (x < y ? -1 : 1) * (s.dir === "asc" ? 1 : -1);
  });
  return out.map((r, i) => ({...r, rank: i + 1}));
}
function renderTable(rows, id, extra){
  rows = sortRows(rows.filter(r => SHOW_HIDDEN || !isHidden(r.id)), id);
  if (!rows.length) return `<div class="empty">Nothing here yet.</div>`;
  const s = SORT[id] || {key: "total", dir: "desc"};
  const th = (key, label, m) => `<th data-sort="${key}" data-table="${id}" class="${s.key === key ? "on" : ""}" title="${m ? esc((LEGEND[key] || "") + " (0 to " + m + ")") : "Sort"}">${label}${s.key === key ? (s.dir === "desc" ? " ↓" : " ↑") : ""}</th>`;
  const cols = [["total", "Total", 100], ...FACTORS];
  const head = `<th>#</th>${th("title", "Idea")}${th("category", "Cat")}${cols.map(([k, l, m]) => th(k, l, m)).join("")}${(extra || []).map(([k, l]) => th(k, l)).join("")}`;
  const cell = (k, r) => `<td class="num">${k === "total" ? `<span class="score">${r.total}</span>` : (r.scores?.[k] ?? "–")}</td>`;
  const body = rows.map(r => `
    <tr class="row" data-row="${esc(r.id)}">
      <td class="rank">${r.rank}</td><td class="idea"><b>${esc(r.title)}</b></td><td>${cat(r.category)}</td>
      ${cols.map(([k]) => cell(k, r)).join("")}${(extra || []).map(([k]) => `<td class="num">${k === "weeks" ? r.weeks_seen : esc(r[k] ?? "")}</td>`).join("")}
    </tr>
    <tr class="more" style="display:none"><td colspan="${3 + cols.length + (extra || []).length}">
      <div class="pitch">${esc(r.pitch)}</div>
      <div class="step"><b>First step</b>${esc(r.first_step)}</div>
      <div class="links">${links(r.evidence)}</div>
      ${voteBar(r.id)}
      <div style="margin-top:10px">${subscores(r.scores, r.reasons)}</div>
      ${dollars(r.dollars, r.hours_per_week)}
    </td></tr>`).join("");
  return `<div class="tblwrap"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}
function legend(){
  return `<div class="legend">Click a column to sort. ${FACTORS.map(([k, l, m]) => `<span><b>${l}</b> ${esc(LEGEND[k])}, 0 to ${m}.</span>`).join(" ")} <span><b>Total</b> the sum, 0 to 100.</span></div>`;
}
function asRow(c, week){
  return {id: c.id, title: c.title, category: c.category, total: c.total, scores: c.scores, reasons: c.reasons,
          pitch: c.pitch, first_step: c.first_step, dollars: c.dollars, hours_per_week: c.hours_per_week,
          evidence: c.evidence, first_week: week, weeks_seen: ""};
}
function ideaRow(r){
  const L = r.latest || {};
  return {id: r.id, title: r.title, category: r.category, total: r.best_score, scores: L.scores, reasons: L.reasons,
          pitch: L.pitch, first_step: L.first_step, dollars: L.dollars, hours_per_week: L.hours_per_week,
          evidence: r.evidence, first_week: r.first_week, weeks_seen: r.weeks_seen};
}
function renderAll(b){
  const chips = ["all", ...CATS].map(k => `<span class="tab ${CAT === k ? "on" : ""}" data-cat="${k}" tabindex="0">${k}</span>`).join("");
  const rows = (CAT === "all" ? b.all_time : b.all_time.filter(r => r.category === CAT)).map(ideaRow);
  return `<div class="tabs" id="cats">${chips}</div>` + renderTable(rows, "all", [["weeks", "Weeks"]]) + legend();
}
function renderRising(b){
  if (!b.rising.length) return `<div class="empty">Ideas seen in three or more weeks show up here.</div>`;
  return renderTable(b.rising.map(ideaRow), "rising", [["weeks", "Weeks"]]) + legend();
}
function render(){
  const b = BOARD; if (!b) return;
  const tw = b.this_week;
  document.getElementById("stamp").innerHTML = tw ? `last run ${fmtDate(b.updated)} · ${esc(tw.week)} ${flag(tw.status)}` : "no runs yet";
  const learned = document.getElementById("learned");
  learned.hidden = !(tw && tw.feedback_note);
  if (tw && tw.feedback_note) learned.textContent = tw.feedback_note;
  renderTiles(b);
  document.querySelectorAll("#tabs .tab").forEach(t => t.classList.toggle("on", t.dataset.tab === TAB));
  const open = new Set([...document.querySelectorAll(".card.open")].map(e => e.dataset.card));
  const view = document.getElementById("view");
  view.innerHTML = TAB === "week" ? renderWeek(b) : TAB === "all" ? renderAll(b) : renderRising(b);
  view.querySelectorAll(".card").forEach(e => { if (open.has(e.dataset.card)) e.classList.add("open"); });
  view.querySelectorAll("#cats .tab").forEach(c => c.onclick = () => { CAT = c.dataset.cat; render(); });
  const ht = document.getElementById("hiddenToggle");
  if (ht) ht.onclick = () => { SHOW_HIDDEN = !SHOW_HIDDEN; render(); };
  document.getElementById("hist").innerHTML = (b.history || []).slice(-12).map(h =>
    `<span title="${h.candidates_scored} scored">${esc(h.week)} ${flag(h.status)}</span>`).join("");
}

/* clicks: expand cards and rows, cast votes */
document.getElementById("view").addEventListener("click", async ev => {
  const t = ev.target;
  if (t.closest("a") || t.closest("input")) return;
  const vb = t.closest("button.vb");
  if (vb) { ev.stopPropagation(); return castVote(vb.dataset.id, vb.dataset.vote); }
  const chip = t.closest("button.chip");
  if (chip) { ev.stopPropagation(); return setReason(chip.dataset.id, chip.dataset.reason); }
  const save = t.closest("button[data-save]");
  if (save) { ev.stopPropagation(); return saveOutcome(save.dataset.save); }
  if (t.closest(".outcome") || t.closest(".reasons") || t.closest(".votes")) return;
  const th = t.closest("th[data-sort]");
  if (th) {
    const id = th.dataset.table, key = th.dataset.sort, cur = SORT[id] || {key: "total", dir: "desc"};
    SORT[id] = {key, dir: cur.key === key ? (cur.dir === "desc" ? "asc" : "desc") : (key === "title" || key === "category" ? "asc" : "desc")};
    return render();
  }
  const card = t.closest(".card");
  if (card) return card.classList.toggle("open");
  const row = t.closest("tr.row");
  if (row) { const n = row.nextElementSibling; n.style.display = n.style.display === "table-row" ? "none" : "table-row"; }
});
document.getElementById("view").addEventListener("keydown", ev => {
  if (ev.key === "Enter" && ev.target.matches("input[data-id]")) saveOutcome(ev.target.dataset.id);
});
document.querySelectorAll("#tabs .tab").forEach(t => {
  t.onclick = () => { TAB = t.dataset.tab; render(); };
  t.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); t.click(); } };
});

async function write(id, body){
  if (!DB) return;
  try { await DB.doc("votes/" + id).set(body); }
  catch (e) {
    if (e?.code === "invalid_argument") { CAN_VOTE = false; render(); }
    else console.warn("vote failed", e);
  }
}
async function castVote(id, vote){
  const cur = voteOf(id);
  if (cur?.vote === vote) {
    VOTES = {...VOTES}; delete VOTES[id]; OPEN_REASONS = null; render();
    try { await DB.doc("votes/" + id).delete(); } catch (e) { console.warn("unvote failed", e); }
    return;
  }
  const body = {vote, reason: null, outcome: cur?.outcome || "", at: new Date().toISOString()};
  VOTES = {...VOTES, [id]: body};
  OPEN_REASONS = vote === "no" ? id : null;
  render();
  await write(id, body);
}
async function setReason(id, reason){
  const cur = voteOf(id) || {vote: "no", outcome: ""};
  const body = {...cur, vote: "no", reason, at: new Date().toISOString()};
  VOTES = {...VOTES, [id]: body}; OPEN_REASONS = null; render();
  await write(id, body);
}
async function saveOutcome(id){
  const input = document.getElementById("out-" + id);
  if (!input) return;
  const cur = voteOf(id) || {vote: "trying", reason: null};
  const body = {...cur, vote: "trying", outcome: input.value.trim(), at: new Date().toISOString()};
  VOTES = {...VOTES, [id]: body};
  await write(id, body);
  const btn = input.nextElementSibling; if (btn) { btn.textContent = "Saved"; setTimeout(() => { btn.textContent = "Save"; }, 1200); }
}

/* data first, votes when the store answers */
fetch(`${DATA_URL}${DATA_URL.includes("?") ? "&" : "?"}t=${Date.now()}`)
  .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
  .then(b => { BOARD = b; render(); })
  .catch(e => {
    document.getElementById("stamp").textContent = "could not load data";
    document.getElementById("view").innerHTML = `<div class="empty">Could not load ${esc(DATA_URL)} (${esc(e.message)}).</div>`;
  });

(async () => {
  if (!window.claude?.use) return;
  const db = await claude.use("db");
  if (!db) return;
  DB = db;
  const user = await claude.use("user");
  const can = user ? await user.can("data.write") : null;
  CAN_VOTE = can !== false;
  db.collection("votes").onSnapshot(snap => {
    const next = {};
    for (const d of snap.docs) if (d.exists) next[d.id] = d.data();
    VOTES = next;
    render();
  }, err => { console.warn("votes subscription ended", err); });
  render();
})();
</script>
</body></html>
